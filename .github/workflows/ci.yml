name: CI

on:

  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  push:
    branches:
      - main

jobs:
  tests:
    name: Unit tests

    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.author_association == 'COLLABORATOR' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'safe to test')

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, macos-15-intel, ubuntu-latest, ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04-arm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout c2pa-rs (main)
        uses: actions/checkout@v4
        with:
          repository: contentauth/c2pa-rs
          ref: main
          path: c2pa-rs

      - name: Configure c2pa-rs main source build
        shell: bash
        run: |
          git -C c2pa-rs log -1 --format='c2pa-rs main: %H %s'
          cargo --version
          rustc --version
          echo "C2PA_BUILD_FROM_SOURCE=ON" >> "$GITHUB_ENV"
          echo "C2PA_RS_PATH=${GITHUB_WORKSPACE//\\//}/c2pa-rs" >> "$GITHUB_ENV"

      - name: Check cmake
        run: cmake --version

      - name: Check Ninja
        run: ninja --version

      - name: Setup MSVC toolchain on Windows
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Print make version and path
        run: |
          which make
          make --version

      - name: Run tests (debug build)
        run: make test

      - name: Run tests (debug build, with sanitizers)
        if: runner.os != 'Windows'
        run: make test-san
